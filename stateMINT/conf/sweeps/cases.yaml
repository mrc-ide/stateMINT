program: stateMINT/train.py
project: stateMINT-sweep
name: sweep-cases
method: bayes
metric:
  goal: minimize
  name: val/loss

# early_terminate:
#   type: hyperband
#   min_iter: 10
#   eta: 3

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0009
    max: 0.009
  dropout:
    distribution: uniform
    min: 0.25
    max: 0.5
  batch_size:
    values: [128]

  # model-specific
  d_state:
    values: [128]
  d_model:
    values: [256]


command:
  - ${env}
  - python
  - -m
  - stateMINT.train
  - "hydra.output_subdir=null"
  - "hydra.run.dir=."
  - ${args_no_hyphens}
  - target=cases
  - use_wandb=true
  - num_epochs=200
  - patience=50
