[project]
name = "mintstate"
dynamic = ["version"]
description = "StateMINT is a state space based neural network emulator for malariasimulation."
authors = [{ name = "Anmol Thapar", email = "mr.anmolthapar@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "jax>=0.10.1",
    "flax>=0.12.7",
    "numpy>=2.4.6",
    "jaxtyping>=0.3.10",
    "omegaconf>=2.3",
    "huggingface-hub>=1.19.0",
    "orbax-checkpoint>=0.12.0",
    "etils>=1.0",
    "mamba2-jax>=1.0.1",
    "pandas>=3.0.3",
]

[project.optional-dependencies]
train = [
    "duckdb>=1.5.3",
    "grain>=0.2.16",
    "hydra-core>=1.3.2",
    "optax>=0.2.8",
    "tqdm>=4.67.3",
    "wandb>=0.27.0",
]
plot = ["matplotlib>=3.10.9", "tqdm>=4.67.3"]
gpu  = ["jax[cuda12]>=0.10.1"]
all  = ["mintstate[train,plot,gpu]"]

[project.urls]
Homepage   = "https://github.com/mrc-ide/stateMINT"
Repository = "https://github.com/mrc-ide/stateMINT"
Weights = "https://huggingface.co/dide-ic/stateMINT"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["stateMINT"]


[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "local: marks tests as local-only, not intended for CI (deselect with '-m \"not local\"')",
]

[tool.ruff]
line-length = 120

