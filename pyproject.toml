[project]
name = "stateMINT"
version = "0.1.0"
description = "StateMINT is a state space based neural network emulator for malariasimulation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "flax>=0.12.7",
    "grain>=0.2.16",
    "hydra-core>=1.3.2",
    "jax>=0.10.1",
    "jaxtyping>=0.3.10",
    "numpy>=2.4.6",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.0",
    "pandas>=3.0.3",
    "tqdm>=4.67.3",
    "wandb>=0.27.0",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.10.1",
]
plot = [
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 120

